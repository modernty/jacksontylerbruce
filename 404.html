  function resolveSlug() {
    const q = new URLSearchParams(location.search).get("p");
    if (q && q.trim()) {
      const slug = q.trim();
      // On the live site, tidy /404.html?p=<slug> -> /<slug> in the address bar
      // (a reload just re-hits 404.html). Skip it where there is no fallback.
      if (!NO_PAGES_FALLBACK) {
        try { history.replaceState(null, "", "/" + encodeURIComponent(slug)); } catch (e) {}
      }
      return slug;
    }

    const seg = location.pathname.split("/").filter(Boolean);
    const last = seg[seg.length - 1] || "";
    if (last && last !== "404" && !/\.html?$/i.test(last)) {
      return decodeURIComponent(last);
    }
    return "";
  }

  /* =============================================================
     CSV — RFC 4180-ish: quoted fields, escaped quotes, CRLF.
     Identical to index.html.
     ============================================================= */
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", quoted = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];

      if (quoted) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else quoted = false;
        } else field += c;
        continue;
      }

      if (c === '"')      quoted = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== "\r") field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }

    return rows.filter(r => r.some(c => c.trim() !== ""));
  }

    const iSlug  = find("slug", "handle", "path");
    const iCopy  = find("copy", "description", "body", "text", "about");
    const iImgs  = find("images", "gallery", "photos");
    const iLName = find("link name", "link_name", "linkname", "cta");
    const iLink  = find("link", "href", "url");
    if (iSlug === -1) return null;

    const slugify = s => s.toLowerCase().trim()
      .replace(/[^\w\s-]/g, "").replace(/\s+/g, "-");

    for (const r of rows.slice(1)) {
      const slug = (r[iSlug] || "").trim() || (iName > -1 ? slugify(r[iName] || "") : "");
      if (slug !== wantSlug) continue;

      const rawCopy = iCopy > -1 ? (r[iCopy] || "") : "";
      const copy = rawCopy.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);

      const images = iImgs > -1
        ? (r[iImgs] || "").split(/\s*\|\s*|\r?\n/).map(s => s.trim()).filter(Boolean)
        : [];

      return {
        name: (iName > -1 ? r[iName] : slug || "").trim(),
        copy: copy.length ? copy : (rawCopy.trim() ? [rawCopy.trim()] : []),
        images,
        linkName: iLName > -1 ? (r[iLName] || "").trim() : "",
        link: iLink > -1 ? (r[iLink] || "").trim() : "",
      };
    }
    return null;
  }

  /* =============================================================
     Render
     ============================================================= */
  const view = document.getElementById("view");

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderNav() {
    const nav = el("nav", "nav");
    const a = el("a", null, "Jackson, Tyler Bruce");
    a.href = ".";
    nav.appendChild(a);
    return nav;
  }

  function renderNotFound() {
    view.replaceChildren(renderNav());
    const p = el("p", "proj__copy");
    p.append("That project isn’t here. ");
    const a = el("a", null, "Index");
    a.href = ".";
    a.style.textDecoration = "underline";
    p.appendChild(a);
    view.appendChild(p);
    document.title = "Not found — Jackson, Tyler Bruce";
  }

  function buildGallery(images) {
    const wrap = el("div", "gallery");
    const viewport = el("div", "gallery__viewport");
    const track = el("div", "gallery__track");

    const slides = [];

    images.forEach((src, i) => {
      const slide = el("div", "gallery__slide");
      const img = new Image();
      img.loading = "lazy";
      img.decoding = "async";
      img.alt = "";
      img.src = src;
      img.onerror = () => console.warn("[project] image failed to load:", src);
      slide.appendChild(img);
      track.appendChild(slide);
      slides.push(slide);
    });

    for (let i = images.length; i < MIN_SLIDES; i++) {
      const slide = el("div", "gallery__slide");
      slide.appendChild(el("div", "surface", "Image " + (i + 1)));
      track.appendChild(slide);
      slides.push(slide);
    }

    viewport.appendChild(track);
    wrap.appendChild(viewport);

    if (slides.length <= 1) return wrap;

    const bar   = el("div", "gallery__bar");
    const prev  = el("button", "gallery__nav", "‹");
    const next  = el("button", "gallery__nav", "›");
    const count = el("span", "gallery__count");
    prev.type = next.type = "button";
    prev.setAttribute("aria-label", "Previous image");
    next.setAttribute("aria-label", "Next image");
    bar.append(prev, next, count);
    wrap.appendChild(bar);

    const reduced = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    const pad = n => String(n).padStart(2, "0");
    let index = 0;

    const sync = () => {
      const w = viewport.clientWidth || 1;
      index = Math.round(viewport.scrollLeft / w);
      index = Math.max(0, Math.min(slides.length - 1, index));
      count.textContent = pad(index + 1) + " / " + pad(slides.length);
      prev.disabled = index <= 0;
      next.disabled = index >= slides.length - 1;
    };

    const go = i => {
      const target = Math.max(0, Math.min(slides.length - 1, i));
      viewport.scrollTo({ left: viewport.clientWidth * target, behavior: reduced ? "auto" : "smooth" });
    };

    prev.addEventListener("click", () => go(index - 1));
    next.addEventListener("click", () => go(index + 1));

    let raf = 0;
    viewport.addEventListener("scroll", () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; sync(); });
    }, { passive: true });

    window.addEventListener("resize", () => go(index), { passive: true });

    wrap.addEventListener("keydown", e => {
      if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === "ArrowLeft")  { e.preventDefault(); go(index - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); go(index + 1); }
    });

    sync();
    return wrap;
  }

  function renderProject(data) {
    view.replaceChildren(renderNav());

    view.appendChild(el("h1", "proj__title", data.name || ""));

    if (data.copy && data.copy.length) {
      const copy = el("div", "proj__copy");
      data.copy.forEach(par => copy.appendChild(el("p", null, par)));
      view.appendChild(copy);
    }

    if (data.link) {
      const a = el("a", "proj__link", data.linkName || "Visit");
      a.href = data.link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      view.appendChild(a);
    }

    view.appendChild(buildGallery(data.images || []));

    document.title = (data.name ? data.name + " — " : "") + "Jackson, Tyler Bruce";
  }

  /* =============================================================
     Boot — baked first, sheet second (same order as index.html)
     ============================================================= */
  const slug = resolveSlug();
  const baked = slug ? SAMPLE[slug] : null;

  if (baked) renderProject(baked);
  else if (slug && CONFIG.sheetCsvUrl) renderProject({ name: "", copy: [], images: [] });
  else renderNotFound();

  if (slug && CONFIG.sheetCsvUrl) {
    fetch(CONFIG.sheetCsvUrl, { cache: "no-store" })
      .then(r => (r.ok ? r.text() : Promise.reject(new Error("HTTP " + r.status))))
      .then(txt => {
        const data = rowToProject(parseCSV(txt), slug);
        if (data) renderProject(data);
        else if (!baked) renderNotFound();
        else console.warn("[project] slug not found in sheet — keeping baked copy:", slug);
      })
      .catch(err => {
        if (!baked) renderNotFound();
        console.warn("[project] sheet unavailable:", err.message);
      });
  }
})();
</script>

</body>
