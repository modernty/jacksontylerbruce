<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lily in Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: a moment picker on top, a live Desk window on the left, Lily's trust line and history on the right. */
:root{
  --bg:#EFECE7; --paper:#F8F7F4; --surface:#FFFFFF; --sunk:#F4F3F1; --chip:#E8E5E0;
  --ink:#141413; --muted:#6F6A63; --line:rgba(20,20,19,.09); --line2:rgba(20,20,19,.16);
  --accent:#E66B36; --accent-soft:#FBE7DD; --draft:#FBF8F4;
  --ok:#2F7D46; --ok-soft:#E3F1E6; --bubble-me:#EBE7E1; --btn:#141413; --btn-fg:#FFFFFF;
  --lily-body:#E3D8CD; --shadow:0 16px 48px rgba(0,0,0,.10);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --paper:#1A1918; --surface:#22201E; --sunk:#1C1B19; --chip:#2E2B28;
  --ink:#F1EEE9; --muted:#A39D94; --line:rgba(241,238,233,.10); --line2:rgba(241,238,233,.20);
  --accent:#F0834F; --accent-soft:#3A2419; --draft:#2A2420;
  --ok:#6CC08A; --ok-soft:#1F3326; --bubble-me:#2E2B28; --btn:#F1EEE9; --btn-fg:#141413;
  --lily-body:#D9CDC0; --shadow:0 16px 48px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --paper:#1A1918; --surface:#22201E; --sunk:#1C1B19; --chip:#2E2B28;
  --ink:#F1EEE9; --muted:#A39D94; --line:rgba(241,238,233,.10); --line2:rgba(241,238,233,.20);
  --accent:#F0834F; --accent-soft:#3A2419; --draft:#2A2420;
  --ok:#6CC08A; --ok-soft:#1F3326; --bubble-me:#2E2B28; --btn:#F1EEE9; --btn-fg:#141413;
  --lily-body:#D9CDC0; --shadow:0 16px 48px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1380px;margin:0 auto;display:grid;gap:20px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* header */
.head{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between}
.head h1{font-size:30px;font-weight:500;letter-spacing:-.02em;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.moments{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.moment{display:grid;gap:1px;text-align:left;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.moment b{font-weight:500;font-size:13px}
.moment span{font-size:11px;color:var(--muted)}
.moment[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.moment[aria-pressed="true"] span{color:inherit;opacity:.7}
.next{padding:10px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:500;font-size:13px}

/* stage banner */
.banner{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.banner .when{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap}
.banner .what{min-width:0}
.banner .what b{font-weight:500}
.banner .what div{color:var(--muted)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:1100px){.main{grid-template-columns:minmax(0,1fr)}}

/* app window */
.app{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line2);background:var(--sunk);box-shadow:var(--shadow);
  display:grid;grid-template-columns:200px minmax(0,1fr);height:720px}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 16px;font-weight:600;font-size:17px}
.desk-tile{width:32px;height:32px;border-radius:8px;background:#D7D3CE;color:#2F2D2B;display:grid;place-items:center;flex:none}
.desk-ic{width:13px;height:13px;display:block}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bp-wm{height:20px;width:auto;display:block;color:var(--ink)}
.brand .mono{margin:0}
.ws{font-size:11px;font-weight:500;color:var(--muted);background:var(--chip);border-radius:99px;padding:2px 8px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;width:100%;text-align:left}
.nav[aria-current="page"]{background:var(--chip);color:var(--ink);font-weight:600}
.nav .ic{width:16px;display:inline-grid;place-items:center;font-size:12px}
.nav .count{margin-left:auto;font-size:11px;background:var(--chip);border-radius:99px;padding:1px 8px;color:var(--muted)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:8px}
.me small{display:block;color:var(--muted);font-size:12px}
.av{width:28px;height:28px;border-radius:99px;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;color:var(--ink)}

.view{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px 0 28px;border-bottom:1px solid var(--line);background:var(--sunk)}
.crumb{display:flex;gap:8px;align-items:center;min-width:0;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumb button{color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.bell{position:relative;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.bell svg{width:16px;height:16px}
.bell .n{color:var(--accent);font-weight:600;font-size:13px}
.body{flex:1;min-height:0;overflow:auto}

/* home */
.home{max-width:700px;margin:0 auto;padding:44px 24px 120px;display:grid;gap:32px}
.hello{display:grid;gap:12px}
.hello h2{font-size:34px;font-weight:500;letter-spacing:-.02em;margin:0}
.hello p{font-size:18px;margin:0;color:var(--muted);text-wrap:pretty}
.link{color:var(--accent);text-decoration:underline dotted;text-underline-offset:4px;text-decoration-thickness:1.5px}
.hl{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:4px}
.stat span{color:var(--muted);font-size:13px}
.stat b{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.agents{display:grid;gap:10px}
.agentrow{display:flex;gap:12px;flex-wrap:wrap}
.agent{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px;width:220px}
.agent .t{display:flex;justify-content:space-between;align-items:start}
.live{font-size:12px;font-weight:500;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:3px 10px;display:flex;gap:6px;align-items:center}
.live::before{content:"";width:7px;height:7px;border-radius:99px;background:currentColor}
.agent h4{margin:0;font-size:15px;font-weight:500}
.agent small{color:var(--muted)}
.agent .foot{border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;align-items:end}
.agent .foot b{font-size:20px;font-weight:500;display:block;font-variant-numeric:tabular-nums}
.credit{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.askbar{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;width:min(640px,calc(100% - 140px));display:flex;gap:10px;align-items:center;
  padding:10px 10px 10px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow);color:var(--muted);text-align:left}
.askbar span{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;font-weight:500;font-size:13px;white-space:nowrap}
.btn.dark{background:var(--btn);color:var(--btn-fg)}
.btn.ghost{border:1px solid var(--line2);background:var(--surface)}
.btn.orange{background:var(--accent);color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}

/* notifications */
.pop{position:absolute;top:52px;right:16px;width:380px;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:20;overflow:hidden}
.pop h5{margin:0;padding:14px 18px;font-size:14px;display:flex;justify-content:space-between}
.pop h5 span{color:var(--muted);font-weight:400}
.ni{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.ni .i{width:32px;height:32px;border-radius:8px;background:var(--chip);display:grid;place-items:center;flex:none}
.ni .x{flex:1;min-width:0}
.ni .x b{display:block;font-weight:500}
.ni .x small{color:var(--muted)}
.empty{padding:6px 18px 18px;color:var(--muted)}

/* ticket */
.ticket{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
.convs{background:var(--surface);border-right:1px solid var(--line);overflow:auto}
.convs .h{padding:14px 16px 10px;display:grid;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-size:12px;font-weight:500;border-radius:99px;padding:3px 10px;background:var(--chip);color:var(--muted)}
.tab.on{background:var(--btn);color:var(--btn-fg)}
.conv{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.conv[aria-current="true"]{background:var(--sunk)}
.conv .x{min-width:0;flex:1}
.conv .x .r{display:flex;justify-content:space-between;gap:8px}
.conv .x b{font-weight:500}
.conv .x small{color:var(--muted)}
.conv .x p{margin:2px 0 0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{display:inline-block;margin-top:6px;font-size:11px;font-weight:500;border-radius:99px;padding:2px 9px;background:var(--chip);color:var(--muted)}
.state.ok{background:var(--ok-soft);color:var(--ok)}
.tk{display:flex;flex-direction:column;min-height:0}
.tk .th{display:flex;gap:12px;align-items:center;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.tk .th .x{flex:1;min-width:0}
.tk .th .x b{display:block;font-weight:500;font-size:15px}
.tk .th .x small{color:var(--muted)}
.pill{font-size:12px;font-weight:500;border-radius:99px;padding:3px 10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.thread{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;max-width:100%}
.msg.me{justify-content:flex-end}
.bub{max-width:min(460px,80%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 15px}
.msg.me .bub{background:var(--bubble-me);border-color:transparent}
.bub small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-bottom:4px}
.ev{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ev::before,.ev::after{content:"";flex:1;height:1px;background:var(--line2)}
.draftrow{display:flex;justify-content:flex-end;gap:10px}
.draft{width:min(460px,80%);background:var(--draft);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:14px;padding:14px 14px 14px 16px;display:flex;gap:12px;align-items:flex-start;transition:all .35s ease}
.draft .x{flex:1;min-width:0;display:grid;gap:4px}
.draft .x b{font-weight:500}
.draft .x p{margin:0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.draft .acts{display:flex;gap:8px;margin-top:8px}
.close{color:var(--muted);padding:2px 4px}
.sending{width:auto;border-radius:99px;padding:9px 16px 9px 10px;align-items:center}
.spin{width:16px;height:16px;border-radius:99px;border:2px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.slot{width:28px;flex:none}
.composer{margin:0 24px 20px;display:flex;gap:10px;align-items:center;padding:10px 10px 10px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);color:var(--muted)}
.composer span{flex:1}

/* teach + ask */
.page{max-width:760px;margin:0 auto;padding:32px 24px 120px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px}
.card.lily{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.card h3{margin:0;font-size:24px;font-weight:500;letter-spacing:-.01em}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:center}
.steps .n{width:24px;height:24px;border-radius:99px;background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;font-size:12px;font-weight:500;flex:none}
.steps li.hand .n{background:var(--chip);color:var(--ink)}
.chatprev{background:var(--sunk);border-radius:12px;padding:14px;display:grid;gap:10px}
.cb{max-width:80%;padding:9px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.cb.cust{justify-self:end;background:var(--btn);color:var(--btn-fg);border:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q{justify-self:end;background:var(--btn);color:var(--btn-fg);padding:10px 14px;border-radius:14px;max-width:80%}
.sugs{display:flex;gap:8px;flex-wrap:wrap}
.sug{font-size:13px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line2)}
.bars{display:flex;gap:14px;align-items:end;height:130px;padding:12px;background:var(--sunk);border-radius:12px}
.bar{flex:1;display:grid;gap:6px;justify-items:center;font-size:11px;color:var(--muted)}
.bar i{display:block;width:100%;border-radius:6px;background:var(--chip)}
.bar i.on{background:var(--accent)}
.typing span{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--muted);margin-right:3px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}

/* Lily dock */
.dock{position:absolute;right:18px;bottom:18px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:calc(100% - 36px)}
.lpill{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 6px;border-radius:99px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow)}
.lpill.has{padding-right:14px}
.lpill .dotn{width:8px;height:8px;border-radius:99px;background:var(--accent)}
.lcard{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.lcard .h{display:flex;gap:10px;align-items:center}
.lcard .h div{flex:1}
.lcard .h b{display:block;font-size:13px}
.lcard .h small{color:var(--muted);font-size:12px}
.lcard p{margin:0;font-size:14px;text-wrap:pretty}
.lcard .ask{padding:9px 12px;border-radius:10px;background:var(--sunk);color:var(--muted);text-align:left}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.lily{display:block;flex:none}

/* side */
.side{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.panel h4{margin:0;font-size:15px;font-weight:600}
.trust{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.trust li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.trust .m{width:18px;height:18px;border-radius:99px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:10px;flex:none}
.trust li.done{color:var(--ink)}
.trust li.done .m{background:var(--btn);border-color:var(--btn);color:var(--btn-fg)}
.trust li.now{color:var(--ink);font-weight:600}
.trust li.now .m{background:var(--accent);border-color:var(--accent)}
.trust li.now em{margin-left:auto;font-style:normal;color:var(--accent);font-size:12px;font-weight:500}
.prog{height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .4s}
.log{list-style:none;margin:0;padding:0;display:grid;gap:0}
.log li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .d{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:2px}
.log li.cur .d{color:var(--accent)}
.log p{margin:0;font-size:13px}
.log li.future{opacity:.45}
.hint{font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);height:760px}
  .rail{display:none}
  .stats{grid-template-columns:minmax(0,1fr)}
  .ticket{grid-template-columns:minmax(0,1fr)}
  .convs{display:none}
  .askbar{width:calc(100% - 32px)}
  .home{padding-bottom:160px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* start screen: pick a prototype; inside a prototype only the app shows */
.start{min-height:calc(100vh - 64px);display:grid;place-content:center;gap:28px;max-width:520px;margin:0 auto;width:100%}
.start .bp-wm{height:22px}
.start h1{font-size:28px;font-weight:500;letter-spacing:-.02em;margin:0}
.start p{margin:6px 0 0;color:var(--muted)}
.protos{display:grid;gap:8px}
.proto{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.proto:hover{border-color:var(--line2);transform:translateY(-1px)}
.proto .t{flex:1;min-width:0}.proto .t b{font-weight:500;display:block}.proto .t span{color:var(--muted);font-size:13px}
.proto .go{color:var(--muted)}
body:not(.in-proto) .wrap{display:none}
body.in-proto .start{display:none}
body.in-proto .head,body.in-proto .banner,body.in-proto .side{display:none}
body.in-proto .main{grid-template-columns:minmax(0,1fr)}
body{margin:0}
body.in-proto{padding:0;overflow:hidden}
body.in-proto .wrap{max-width:none;gap:0}
body.in-proto .app{height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
.back{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:50;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 10px;opacity:.35;transition:opacity .15s}
.back:hover,.back:focus-visible{opacity:1;color:var(--ink)}
body:not(.in-proto) .back{display:none}

/* Portfolio story mode (?story): the moments, the live Desk and Lily's trust line, all on one page. */
body.story .start{display:none}
body.story .wrap{display:grid}
body.story .back{display:none}

const S = {stage:0,view:'home',pop:false,dock:'pill',ticket:0,phase:'draft',sent:{},approvals:0,taught:false,granted:false,unlockAnswered:false,toastText:'',ask:null,dismissed:{}};

const st = () => STAGES[S.stage];
let timers=[];const later=(fn,ms)=>timers.push(setTimeout(fn,ms));const clearT=()=>{timers.forEach(clearTimeout);timers=[]};

function setStage(i){
  clearT();const g=STAGES[i];
  Object.assign(S,{stage:i,view:'home',pop:false,dock:'pill',ticket:0,phase:'draft',sent:{},approvals:g.approvals,taught:!!g.taught,granted:!!g.granted,unlockAnswered:false,ask:null,dismissed:{}});
  render();
  later(()=>{S.toastText=g.toast;S.dock='toast';render()},900);
}
function enter(){document.body.classList.add('in-proto');setStage(2);if(location.hash!=='#lily-home')history.replaceState(null,'','#lily-home')}
function exitProto(){clearT();document.body.classList.remove('in-proto');history.replaceState(null,'',location.pathname+location.search)}
function openRefunds(){S.view='ticket';S.pop=false;S.ticket=firstOpen();S.phase='draft';render()}
function firstOpen(){const n=refundsList();const i=n.findIndex(t=>!S.sent[t.id]);return i<0?0:i}
function refundsList(){return TICKETS.slice(0,st().refunds)}
function notifs(){
  const g=st(),out=[];const open=refundsList().filter(t=>!S.sent[t.id]).length;
  if(open)out.push({k:'ref',i:'$',t:`${open} refund${open>1?'s are':' is'} waiting on you`,s:'Lily drafted the replies',b:'Review',act:'refunds'});
  if(g.late&&!S.taught&&!S.dismissed.late)out.push({k:'late',i:'✦',t:'41 late-box questions went unanswered',s:'Teach Menu Guide a new skill',b:'Teach',act:'teach'});
  if(g.unlock&&!S.unlockAnswered)out.push({k:'unlock',i:'↑',t:'Lily can take on small refunds',s:'You approved 20 of her drafts',b:'Decide',act:'unlockcard'});
  if(g.weekend&&!S.dismissed.weekend)out.push({k:'wk',i:'◷',t:'Weekend replies are slow',s:'2h 10m to first reply, 14m on weekdays',b:'See why',act:'askweekend'});
  return out;
}

}

    <div class="hello">${LILY(40)}<h2>${g.hello}</h2><p>${g.line(n)}</p></div>
    <div class="stats">${[['Conversations',g.conv],['Handled by agents'+(S.granted?' and Lily':''),g.handled],['Sent to your team',g.team]].map(([k,v])=>`<div class="stat"><span>${k} · ${g.period.toLowerCase()}</span><b>${v.toLocaleString()}</b></div>`).join('')}</div>
    <div class="agents"><div class="mono">Your agents</div><div class="agentrow">
      <div class="agent"><div class="t">${MG(44)}<span class="live">Live</span></div><div><h4>Menu Guide</h4><small>Website chat · ${S.taught?4:3} skills</small></div><div class="foot"><div><b>${g.handled}</b><small>handled ${g.period.toLowerCase()}</small></div><span>→</span></div></div>
      ${S.granted?`<div class="agent"><div class="t">${LILY(44)}<span class="live">On</span></div><div><h4>Lily</h4><small>Refunds under $50</small></div><div class="foot"><div><b>14</b><small>refunds issued this week</small></div><span>→</span></div></div>`:''}
    </div></div>
  </div>`;
}
function pop(){
  const ns=notifs();
  return `<div class="pop" role="dialog" aria-label="Needs you"><h5>Needs you <span>${ns.length}</span></h5>
   ${ns.length?ns.map(x=>`<div class="ni"><span class="i" style="${x.i==='✦'||x.i==='↑'?'color:var(--accent)':''}">${x.i}</span><div class="x"><b>${x.t}</b><small>${x.s}</small></div><button class="btn ghost sm" data-act="${x.act}">${x.b}</button></div>`).join(''):`<div class="empty">You’re all caught up. Lily will say if anything comes up.</div>`}</div>`;
}
function ticket(){
  const list=refundsList();if(!list.length){return `<div class="page"><div class="card"><b>No refunds waiting.</b><span class="hint">Lily handles refunds under $50 now. Bigger ones still come to you.</span></div></div>`}
  const t=list[S.ticket],sent=S.sent[t.id],open=list.filter(x=>!S.sent[x.id]).length;
  return `<div class="ticket">
   <div class="convs"><div class="h"><b>Conversations</b><div class="tabs"><span class="tab on">Waiting on you · ${open}</span><span class="tab">All</span></div></div>
    ${list.map((x,i)=>`<button class="conv" aria-current="${i===S.ticket}" data-ticket="${i}"><span class="av">${x.ini}</span><span class="x"><span class="r"><b>${x.name}</b><small style="${x.wait==='1d'?'color:var(--accent)':''}">${x.wait}</small></span><p>${x.subj}</p>${S.sent[x.id]?'<span class="state ok">Resolved</span>':''}</span></button>`).join('')}
    ${OTHER.map(x=>`<div class="conv"><span class="av">${x.ini}</span><span class="x"><span class="r"><b>${x.name}</b><small>${x.t}</small></span><p>${x.p}</p><span class="state">${x.s}</span></span></div>`).join('')}
   </div>
   <div class="tk">
    <div class="th"><span class="av" style="width:34px;height:34px">${t.ini}</span><div class="x"><b>${t.subj}</b><small>${t.name} · Website chat · opened ${t.wait} ago</small></div><span class="pill ${sent?'ok':''}">${sent?'Resolved':'Waiting on you'}</span></div>
    <div class="thread">
      <div class="msg"><span class="av">${t.ini}</span><div class="bub"><small>${t.name}</small>${t.q}</div></div>
      <div class="msg me"><div class="bub"><small>Menu Guide · Agent</small>${t.mg}</div>${MG(28)}</div>
      <div class="ev">Handed to your team · refund needs approval</div>
      ${sent?`<div class="msg me"><div class="bub"><small>Menu Guide · approved by Maya</small>${t.reply}</div>${MG(28)}</div><div class="ev">Refund issued · $${t.amt} · just now</div>`:''}
      ${!sent&&S.phase==='draft'?`<div class="draftrow"><div class="draft">${LILY(24)}<div class="x"><b>Lily drafted a reply · refund $${t.amt}</b><p>${t.reply}</p><div class="acts"><button class="btn dark sm" data-act="approve">Approve and send</button><button class="btn ghost sm" data-act="edit">Edit</button></div></div><button class="close" aria-label="Dismiss" data-act="dismissdraft">✕</button></div><span class="slot"></span></div>`:''}
      ${!sent&&S.phase==='sending'?`<div class="draftrow"><div class="draft sending">${MG(22)}<span class="spin"></span><b style="font-weight:500">Sending with Menu Guide…</b></div><span class="slot"></span></div>`:''}
    </div>
    ${sent&&open?`<div style="display:flex;justify-content:flex-end;padding:0 24px 10px"><button class="btn dark sm" data-act="nextticket">Next refund →</button></div>`:''}
    <div class="composer"><span>Reply to ${t.name.split(' ')[0]}, or ask Lily…</span><span class="btn ghost sm">Send</span></div>
   </div></div>`;
}
function teach(){
  if(S.taught)return `<div class="page"><div class="card lily"><div class="row">${LILY(28)}<b>Menu Guide can track a late box.</b></div><span class="hint">It moved to Taught in the training plan. Late-box questions will stop coming to you.</span><div><button class="btn dark sm" data-act="home">Back to Home</button></div></div></div>`;
  return `<div class="page">
   <div class="card lily"><div class="row">${LILY(28)}<b>Lily</b><span class="hint">Teaching Menu Guide</span></div><h3>Let’s teach Menu Guide to track a late box.</h3><span class="hint"><b class="hl">41</b> customers asked this since Oct 1 and Menu Guide couldn’t answer. Here’s how it will.</span></div>
   <div class="card"><div class="mono">How Menu Guide will handle it</div><ol class="steps"><li><span class="n">1</span>Look up the order</li><li><span class="n">2</span>Check where the box is</li><li><span class="n">3</span>Tell the customer plainly</li><li class="hand"><span class="n">4</span>Hand to your team when it’s over 2 days late</li></ol></div>
   <div class="card"><div class="mono">Try it</div><div class="chatprev"><div class="cb cust">Where’s my box? It was due yesterday.</div><div class="cb">Sorry, it’s running late. Order #4471 is with the courier and should arrive by 6pm today. It stays cold for 48 hours, so your food will be fine.</div></div></div>
   <div class="row"><button class="btn orange" data-act="taught">Teach Menu Guide</button><button class="btn ghost" data-act="home">Save for later</button></div>
  </div>`;
}
const ANSWERS={
  'Why were handoffs up on Tuesday?':{t:'31 handoffs on Tuesday, about twice a normal day. Most were late-box questions after a courier delay that morning.',bars:[12,31,14,11,13,8,7],act:['Teach “Track a late box”','teach']},
  'How is the team doing on weekends?':{t:'Weekend handoffs wait 2h 10m for a first reply. On weekdays it’s 14 minutes. One person on a Saturday morning shift would cover most of them.',bars:[14,14,15,13,16,130,120],labels:['M','T','W','T','F','S','S'],unit:'min',act:null},
  'What should I teach next?':{t:'“Track a late box” would stop the most handoffs: 41 since Oct 1. After that, “Refund after cancelling” (14 this month).',act:['Teach “Track a late box”','teach']}
};
function ask(){
  const q=S.ask;const a=q&&ANSWERS[q];const qs=Object.keys(ANSWERS);
  return `<div class="page">
   ${q?`<div class="q">${q}</div><div class="card">${S.typing?`<div class="row">${LILY(26)}<span class="typing"><span></span><span></span><span></span></span></div>`:`<div class="row">${LILY(26)}<b>Lily</b></div><p style="margin:0;font-size:15px">${a.t}</p>${a.bars?`<div class="bars">${a.bars.map((v,i)=>`<div class="bar"><i class="${v===Math.max(...a.bars)?'on':''}" style="height:${Math.round(v/Math.max(...a.bars)*90)}px"></i>${(a.labels||['M','T','W','T','F','S','S'])[i]}</div>`).join('')}</div>`:''}${a.act&&!S.taught?`<div><button class="btn orange sm" data-act="${a.act[1]}">${a.act[0]}</button></div>`:''}`}</div>`:`<div class="card lily"><div class="row">${LILY(28)}<b>Ask me about your desk</b></div><span class="hint">I answer from your tickets, agents and team. Typed by default; talking is optional.</span></div>`}
   <div class="sugs">${qs.filter(x=>x!==q).map(x=>`<button class="sug" data-q="${x}">${x}</button>`).join('')}</div>
  </div>`;
}
function dock(){
  const g=st();
  if(S.dock==='toast'){
    const unlock=g.unlock&&!S.unlockAnswered&&S.toastText===g.toast;
    return `<div class="lcard" role="status"><div class="h">${LILY(30)}<div><b>Lily</b><small>${g.date}</small></div><button class="close" data-act="dockclose" aria-label="Minimise">—</button></div>
      <p>${S.toastText}</p>
      <div class="row">${unlock?`<button class="btn dark sm" data-act="grant">Yes, go ahead</button><button class="btn ghost sm" data-act="deny">Not yet</button>`:
        notifs().some(x=>x.k==='ref')&&S.view!=='ticket'?`<button class="btn dark sm" data-act="refunds">Review refunds</button><button class="btn ghost sm" data-act="dockclose">Later</button>`:
        `<button class="btn ghost sm" data-act="dockclose">Thanks</button>`}</div>
      <button class="ask" data-act="ask">Ask Lily…</button></div>`;
  }
  const n=notifs().length;
  return `<button class="lpill ${n?'has':''}" data-act="dockopen" aria-label="Open Lily">${LILY(28)}${n?'<span class="dotn"></span>':''}</button>`;
}
function renderSide(){
  const g=st(),cur=S.granted?5:g.trust;const ap=Math.min(S.approvals,20);
  $('#side').innerHTML=`
  <div class="panel"><h4>What Lily can do</h4>
    <ul class="trust">${TRUST.map((t,i)=>`<li class="${i<cur?'done':i===cur?'now':''}"><span class="m">${i<cur?'✓':''}</span>${t}${i===cur?'<em>Now</em>':''}</li>`).join('')}</ul>
    ${cur>=4&&!S.granted?`<div style="display:grid;gap:6px"><span class="hint">Refund drafts approved: <b style="color:var(--ink)">${ap} of 20</b></span><div class="prog"><i style="width:${ap/20*100}%"></i></div></div>`:''}
    ${S.granted?`<span class="hint">Refunds under $50 are hers now. Bigger ones still come to Maya.</span>`:''}
  </div>
  <div class="panel"><h4>Lily over time</h4>
    <ul class="log">${STAGES.map((x,i)=>`<li class="${i===S.stage?'cur':i>S.stage?'future':''}"><span class="d">${x.label}</span><p>${x.log}</p></li>`).join('')}</ul>
    <span class="hint">Try: the bell, the underlined link, Lily in the corner, “Approve and send”, and Ask Lily.</span>
  </div>`;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-stage],[data-ticket],[data-q],[data-proto]');if(!b)return;
  if(b.dataset.proto)return enter();
  if(b.dataset.act==='exit')return exitProto();
  if(b.dataset.stage!==undefined)return setStage(+b.dataset.stage);
  if(b.dataset.ticket!==undefined){S.ticket=+b.dataset.ticket;S.phase='draft';return render()}
  if(b.dataset.q){S.view='ask';S.ask=b.dataset.q;S.typing=true;render();clearT();later(()=>{S.typing=false;render()},900);return}
  const a=b.dataset.act;
  switch(a){
    case 'next':return setStage(Math.min(S.stage+1,STAGES.length-1));
    case 'home':S.view='home';S.pop=false;break;
    case 'inbox':S.view=st().refunds?'ticket':'home';break;
    case 'notifs':S.pop=!S.pop;break;
    case 'refunds':S.dock='pill';return openRefunds();
    case 'teach':S.view='teach';S.pop=false;S.dock='pill';break;
    case 'taught':S.taught=true;S.toastText='Menu Guide learned “Track a late box”. I’ll tell you next Monday how many it answered.';S.dock='toast';break;
    case 'ask':S.view='ask';S.pop=false;S.dock='pill';break;
    case 'askweekend':S.view='ask';S.pop=false;S.ask='How is the team doing on weekends?';S.typing=true;render();later(()=>{S.typing=false;render()},900);return;
    case 'unlockcard':S.pop=false;S.toastText=st().toast;S.dock='toast';break;
    case 'grant':S.granted=true;S.unlockAnswered=true;S.toastText='Thanks, Maya. I’ll issue refunds under $50 within your policy and list each one in your weekly read.';break;
    case 'deny':S.unlockAnswered=true;S.toastText='No problem. I’ll keep drafting them for you to approve, and ask again in a few weeks.';break;
    case 'dockopen':S.toastText=S.toastText||st().toast;S.dock='toast';break;
    case 'dockclose':S.dock='pill';break;
    case 'dismissdraft':S.phase='dismissed';break;
    case 'edit':break;
    case 'approve':{
      const t=refundsList()[S.ticket];S.phase='sending';render();
      later(()=>{S.sent[t.id]=true;S.approvals++;S.phase='draft';
        const left=refundsList().filter(x=>!S.sent[x.id]).length;
        S.toastText=S.approvals>=20?`Sent. That’s 20 of 20. Next Monday I’ll ask if I can take small refunds on.`:`Sent. That’s ${S.approvals} of 20 approvals. ${left?`${left} refund${left>1?'s':''} left.`:'All refunds done.'}`;
        S.dock='toast';render();later(()=>{if(S.dock==='toast'){S.dock='pill';render()}},4200)},1300);return}
    case 'nextticket':S.ticket=firstOpen();S.phase='draft';break;
  }
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.pop||S.dock==='toast')){S.pop=false;S.dock='pill';render()}});
if(location.hash==='#lily-home')enter();
if(new URLSearchParams(location.search).has('story')){document.documentElement.dataset.theme='light';document.body.classList.add('story');setStage(0)}
</script>

</body></html>
